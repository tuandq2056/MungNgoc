[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extract_srt_from_video"
version = "1.0.0"
description = "Bóc tách phụ đề tiếng Trung sang .srt và tạo lồng tiếng tiếng Việt đa giọng đọc chuẩn mốc thời gian."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "tuanlala" }
]
dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "deep-translator>=1.11.0",
    "edge-tts>=7.0.0",
]

[project.scripts]
extract-srt = "extract_srt_from_video.cli:main"
srt-to-voice = "srt_to_voice.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["extract_srt_from_video*", "srt_to_voice*"]

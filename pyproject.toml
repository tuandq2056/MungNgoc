[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mungngoc"
version = "1.0.0"
description = "Hệ thống bóc tách, dịch thuật Qwen và lồng tiếng video đa module tự động."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "tuanlala" }
]
dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "deep-translator>=1.11.0",
    "edge-tts>=7.0.0",
]

[project.scripts]
auto-dub = "pipeline:main"
extract-srt = "extract_srt_from_video.cli:main"
srt-to-voice = "srt_to_voice.cli:main"
video-dubber = "video_dubber.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["extract_srt_from_video*", "srt_to_voice*", "video_dubber*"]

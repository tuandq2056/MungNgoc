version: '3.8'

services:
  pipeline:
    build: .
    network_mode: "host" # Kết nối với Ollama chạy tại localhost:11434
    volumes:
      - ./sample:/app/sample
      - ./output:/app/output
      - model_cache:/app/.cache/extract_srt_from_video
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - QWEN_MODEL=qwen2.5:3b-instruct

volumes:
  model_cache:
